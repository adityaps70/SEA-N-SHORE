name: Expand Sea N Shore production source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/source.tar.gz.b64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand production source
        shell: bash
        run: |
          base64 --decode bootstrap/source.tar.gz.b64 > /tmp/sea-n-shore-source.tar.gz
          tar -xzf /tmp/sea-n-shore-source.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: add Sea N Shore production application"
          git push origin HEAD:main
